<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 1-Car Finder</title>
    <link rel="stylesheet" href="CSS/main.css" />
  </head>
  <body>
    <div class="formpanel">
      <h1>Car Finder</h1>
      <h1>Find your dream vehicle!</h1>
      <p>
        Have you been dreaming about getting a new vehicle?<br />
        well you're in luck!
      </p>
      <div class="searchcontainer">
        <div class="inputgroup">
          <h2 class="label">Year</h2>

          <select id="selectyear">
            <option value="">Select Year</option>
          </select>
        </div>

        <div class="inputgoup">
          <h2 class="label">Make</h2>
          <select id="make" disabled>
            <option value="">Select Make</option>
          </select>
        </div>

        <div class="inputgroup">
          <h2 class="label">Model</h2>

          <select id="model" disabled>
            <option value="">Select Model</option>
          </select>
        </div>
      </div>
    </div>

    <script src="JS/main.js"></script>
  </body>
</html>
